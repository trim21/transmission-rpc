name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ty:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true
          enable-cache: true

      - run: uv sync --locked --extra dev

      - name: ty
        run: ty check transmission_rpc --output-format=github

  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: trim21/actions/prek@master

  sphinx:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true
          enable-cache: true

      - run: uv sync --locked --extra dev

      - run: sphinx-build -W docs/ dist/

  pyright:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.3
        id: setup-uv
        with:
          activate-environment: true

      - run: uv sync --locked --extra dev

      - uses: jakebailey/pyright-action@v3
        with:
          python-path: ${{ steps.setup-uv.outputs.venv }}/bin/python
