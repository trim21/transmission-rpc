name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '1 4 * * 4'

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        transmission: ["version-3.00-r8", "4.0.5", "4.1.3"]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      transmission:
        image: linuxserver/transmission:${{ matrix.transmission }}
        ports:
          - 8080:9091
          - 6881:6881
        env:
          UID: "1000"
          TZ: Etc/UTC
          USER: admin
          PASS: my-secret-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --frozen --extra dev

      - name: test
        run: coverage run -m pytest
        env:
          TR_PROTOCOL: http
          TR_HOST: 127.0.0.1
          TR_PORT: 8080
          TR_USER: admin
          TR_PASSWORD: my-secret-password

      - uses: codecov/codecov-action@v7
        with:
          flags: "${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-unix-socket:
    # Unix socket support was added in Transmission 4.0.0, so the distro
    # provided daemon is new enough here. The runner image ships a stale apt
    # index, so refresh it before installing.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y transmission-daemon
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: '3.10'
      - run: uv sync --frozen --extra dev
      - name: test over unix socket
        run: |
          sudo ls -l /etc/apparmor.d 2>/dev/null | grep -i transmission || true
          sudo cat /etc/apparmor.d/*transmission* 2>/dev/null | head -80 || true
          sudo apparmor_parser -R /etc/apparmor.d/*transmission* 2>&1 || true
          mkdir -p $HOME/Downloads
          transmission-daemon --rpc-bind-address unix:/tmp/transmission.socket -f > /tmp/transmission-daemon.log 2>&1 &
          timeout 60 bash -c 'until [ -S /tmp/transmission.socket ]; do sleep 0.5; done' || {
            tail -40 /tmp/transmission-daemon.log
            sudo dmesg | grep -i -E "apparmor|denied|transmission" | tail -20
            exit 1
          }
          coverage run -m pytest
        env:
          TR_PROTOCOL: 'http+unix'
          TR_HOST: '/tmp/transmission.socket'
          TR_PORT: 9091
          TR_USER: admin
          TR_PASSWORD: password
      - uses: codecov/codecov-action@v7
        with:
          flags: "unix-socket"
          token: ${{ secrets.CODECOV_TOKEN }}

  dist-files:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: pipx run build

      - name: Check Files
        run: pipx run twine check --strict dist/*

  test-checks:
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - run: echo "all test checks passed"
