name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '1 4 * * 4'

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        transmission: ["version-3.00-r8", "4.0.5", "4.1.3"]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      transmission:
        image: linuxserver/transmission:${{ matrix.transmission }}
        ports:
          - 8080:9091
          - 6881:6881
        env:
          UID: "1000"
          TZ: Etc/UTC
          USER: admin
          PASS: my-secret-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --frozen --extra dev

      - name: test
        run: coverage run -m pytest
        env:
          TR_PROTOCOL: http
          TR_HOST: 127.0.0.1
          TR_PORT: 8080
          TR_USER: admin
          TR_PASSWORD: my-secret-password

      - uses: codecov/codecov-action@v7
        with:
          flags: "${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-unix-socket:
    # Unix socket support was added in Transmission 4.0.0, so run the daemon
    # from the same pinned image the matrix above uses instead of whatever
    # version the runner image happens to ship.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Run transmission on a unix socket
        run: |
          mkdir -p /tmp/transmission/{config,socket,config/downloads}
          cat > /tmp/transmission/config/settings.json <<'EOF'
          {
            "rpc-bind-address": "unix:/socket/transmission.sock",
            "rpc-socket-mode": "0777",
            "rpc-authentication-required": true,
            "rpc-username": "admin",
            "rpc-password": "password",
            "rpc-whitelist-enabled": false,
            "download-dir": "/config/downloads"
          }
          EOF
          docker run -d --name transmission \
            --entrypoint /usr/bin/transmission-daemon \
            -v /tmp/transmission/config:/config \
            -v /tmp/transmission/socket:/socket \
            linuxserver/transmission:4.1.3 \
            -g /config -f
          timeout 60 bash -c 'until [ -S /tmp/transmission/socket/transmission.sock ]; do sleep 0.5; done' \
            || { docker logs transmission; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: '3.10'
      - run: uv sync --frozen --extra dev
      - run: coverage run -m pytest
        env:
          TR_PROTOCOL: 'http+unix'
          TR_HOST: '/tmp/transmission/socket/transmission.sock'
          TR_PORT: 9091
          TR_USER: admin
          TR_PASSWORD: password
      - uses: codecov/codecov-action@v7
        with:
          flags: "unix-socket"
          token: ${{ secrets.CODECOV_TOKEN }}

  dist-files:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: pipx run build

      - name: Check Files
        run: pipx run twine check --strict dist/*

  test-checks:
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - run: echo "all test checks passed"
